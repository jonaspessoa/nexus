services:
  - type: web
    name: nexus-web
    runtime: docker
    plan: starter
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    envVars:
      - key: NEXUS_API_HOSTPORT
        fromService:
          type: pserv
          name: nexus-api
          property: hostport

  - type: pserv
    name: nexus-api
    runtime: docker
    plan: starter
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    preDeployCommand: alembic upgrade head
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-postgres
          property: connectionString
      - key: NEXUS_OPERATOR_PASSWORD
        sync: false
      - key: NEXUS_SECURE_COOKIE
        value: "1"
      - key: NEXUS_GITHUB_REPOSITORY
        value: jonaspessoa/nexus

  - type: worker
    name: nexus-sentinel
    runtime: docker
    plan: starter
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    dockerCommand: python check_worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-postgres
          property: connectionString

databases:
  - name: nexus-postgres
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
