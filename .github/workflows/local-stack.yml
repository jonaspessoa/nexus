name: Local stack

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXUS_DB_PASSWORD: ci-only-password
      NEXUS_OPERATOR_PASSWORD: workspace-test-password
      NEXUS_GITHUB_REPOSITORY: jonaspessoa/nexus
    steps:
      - uses: actions/checkout@v4
      - name: Test GitHub response parsing
        run: python3 -m unittest api.test_devhub api.test_sentinel
      - name: Build and start
        run: docker compose up --build -d
      - name: Check the workspace
        run: |
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000 >/dev/null
          docker compose exec -T api python seed.py
          docker compose exec -T api python seed.py
          test "$(docker compose exec -T db psql -U nexus -d nexus -Atc "SELECT count(*) FROM projects WHERE slug = 'portfolio-demo'")" = 1
          curl --fail --silent --show-error http://127.0.0.1:3000 -o workspace.html
          grep -q 'API conectada' workspace.html
      - name: Check the worker against a controlled HTTP endpoint
        run: |
          docker compose stop sentinel
          docker compose exec -T api python - < api/tests/check_worker_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test the operator journey
        env:
          NEXUS_TEST_OUTAGE_HISTORY: "1"
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Restore a backup into a separate database
        run: |
          docker compose exec -T db pg_dump -U nexus -d nexus -Fc -f /tmp/nexus.dump
          docker compose exec -T db createdb -U nexus nexus_restore
          docker compose exec -T db pg_restore --exit-on-error -U nexus -d nexus_restore /tmp/nexus.dump
          test "$(docker compose exec -T db psql -U nexus -d nexus_restore -Atc "SELECT count(*) FROM projects WHERE slug = 'portfolio-demo'")" = 1
          test "$(docker compose exec -T db psql -U nexus -d nexus_restore -Atc "SELECT count(*) FROM service_checks WHERE http_status = 503")" -ge 1
      - name: Print service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v
