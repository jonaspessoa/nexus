name: Local stack

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXUS_DB_PASSWORD: ci-only-password
      NEXUS_OPERATOR_PASSWORD: workspace-test-password
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up --build -d
      - name: Check the workspace
        run: |
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000 >/dev/null
          docker compose exec -T api python seed.py
          docker compose exec -T api python seed.py
          test "$(docker compose exec -T db psql -U nexus -d nexus -Atc "SELECT count(*) FROM projects WHERE slug = 'portfolio-demo'")" = 1
          curl --fail --silent --show-error http://127.0.0.1:3000 -o workspace.html
          grep -q 'API conectada' workspace.html
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test the operator journey
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Print service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v
